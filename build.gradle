plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version "${moddev_version}"
}

repositories {
    exclusiveContent {
        forRepository {
            mavenCentral()
        }
        filter {
            // Minecraft's standard libraries are published to Maven Central.
            // Keep NeoForge's own modules and Mojang-owned libraries on their
            // respective official repositories below.
            includeGroupByRegex('^(?!(?:net\\.neoforged(?:\\.|$)|net\\.minecraftforge(?:\\.|$)|io\\.codechicken(?:\\.|$)|net\\.covers1624(?:\\.|$)|com\\.mojang(?:\\.|$)|org\\.lwjgl(?:\\.|$))).+$')
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.neoforged.net/mojang-meta/' }
        }
        filter {
            includeModule('net.neoforged', 'minecraft-dependencies')
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                url = 'https://repo.maven.apache.org/maven2/'
                artifactUrls 'https://mojang-librariesminecraftnet.azureedge.net/'
            }
        }
        filter {
            includeGroup('org.lwjgl')
        }
    }
    // Canonical Azure CDN name advertised by libraries.minecraft.net. It
    // serves the same Mojang artifacts with a valid TLS certificate on this
    // host, where the vanity hostname's TLS handshake is unreachable.
    exclusiveContent {
        forRepository {
            maven { url = 'https://mojang-librariesminecraftnet.azureedge.net/' }
        }
        filter {
            includeGroup('com.mojang')
        }
    }
    exclusiveContent {
        forRepository {
            maven { url = 'https://maven.neoforged.net/releases' }
        }
        filter {
            includeModule('io.codechicken', 'DiffPatch')
            includeModule('net.covers1624', 'Quack')
            includeModule('net.neoforged', 'neoforge')
            includeModule('net.neoforged', 'neoform')
            includeModule('net.neoforged', 'mergetool')
            includeModule('net.neoforged', 'AutoRenamingTool')
            includeModule('net.neoforged', 'JarJarSelector')
            includeModule('net.neoforged', 'JarJarMetadata')
            includeModule('net.neoforged', 'bus')
            includeGroup('net.neoforged.jst')
            includeGroup('net.neoforged.fancymodloader')
            includeGroup('net.neoforged.accesstransformers')
            includeGroup('net.neoforged.installertools')
            includeModule('net.minecraftforge', 'mergetool')
            includeModule('net.minecraftforge', 'srgutils')
        }
    }
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

// NeoForm normally obtains these ordinary Java tools through Mojang's library
// CDN. The CDN endpoint is unreachable from this host, while Maven Central and
// NeoForge's official repository are reachable. Resolving the same immutable
// coordinates here lets Gradle reuse its shared local artifact cache without
// substituting a third-party mirror.
configurations {
    neoFormToolBootstrap {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    neoFormToolBootstrap 'it.unimi.dsi:fastutil:8.3.1'
    neoFormToolBootstrap 'org.apache.commons:commons-lang3:3.9'
    neoFormToolBootstrap 'org.apache.commons:commons-compress:1.18'
    neoFormToolBootstrap 'net.sf.jopt-simple:jopt-simple:5.0.4'
    neoFormToolBootstrap 'org.ow2.asm:asm:9.5'
    neoFormToolBootstrap 'org.ow2.asm:asm-tree:9.5'
    neoFormToolBootstrap 'org.ow2.asm:asm-util:9.5'
    neoFormToolBootstrap 'org.ow2.asm:asm-analysis:9.5'
    neoFormToolBootstrap 'org.tukaani:xz:1.8'
    neoFormToolBootstrap 'org.vineflower:vineflower:1.11.2'
    neoFormToolBootstrap 'io.codechicken:DiffPatch:2.0.0.36:all@jar'
    neoFormToolBootstrap 'net.covers1624:Quack:0.4.10.101'
    neoFormToolBootstrap 'net.neoforged.jst:jst-cli-bundle:1.0.74'
    neoFormToolBootstrap 'net.minecraftforge:mergetool:1.1.7:fatjar@jar'
    neoFormToolBootstrap 'net.minecraftforge:srgutils:0.4.15'
    neoFormToolBootstrap 'net.neoforged:neoforge:21.11.42:userdev@jar'
    neoFormToolBootstrap 'net.neoforged:neoform:1.21.11-20251209.172050@zip'
    neoFormToolBootstrap 'net.neoforged:mergetool:2.0.7'
    neoFormToolBootstrap 'net.neoforged:AutoRenamingTool:2.0.17'
    neoFormToolBootstrap 'net.neoforged.installertools:installertools:4.0.7'
    neoFormToolBootstrap 'org.ow2.asm:asm:9.8'
    neoFormToolBootstrap 'org.ow2.asm:asm-commons:9.8'
    neoFormToolBootstrap 'org.ow2.asm:asm-tree:9.8'
    neoFormToolBootstrap 'org.ow2.asm:asm-util:9.8'
    neoFormToolBootstrap 'org.ow2.asm:asm-analysis:9.8'
    neoFormToolBootstrap 'org.apache.logging.log4j:log4j-api:2.22.1'
    neoFormToolBootstrap 'org.apache.logging.log4j:log4j-core:2.8.1'
    neoFormToolBootstrap 'com.google.guava:guava:31.1-jre'
    neoFormToolBootstrap 'com.google.code.gson:gson:2.10'
    neoFormToolBootstrap 'org.slf4j:slf4j-api:2.0.9'
    neoFormToolBootstrap 'ca.weblite:java-objc-bridge:1.1'
}

tasks.register('bootstrapNeoFormTools') {
    group = 'build setup'
    description = 'Resolves NeoForm tooling from Maven Central and NeoForge official repositories.'
    doLast {
        configurations.neoFormToolBootstrap.resolve()
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

neoForge {
    version = neo_version

    // The original Fabric source expressed these visibility requirements via
    // an access widener. NeoForge consumes the equivalent access-transformer
    // format during both compilation and runtime remapping.
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        create {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client { client() }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument('--nogui')
        }
    }
}

sourceSets {
    main {
        java.srcDir('src/client/java')
        resources.srcDir('src/client/resources')

        // Optional UI and mod integrations remain out of the native build until
        // their NeoForge implementations and dependencies are available.
        // This currently includes REI/JEI/EIV, Trinkets, ComputerCraft, and
        // renderer-specific compatibility that only targets Fabric/Sodium APIs.
        // Native fluid block rendering is supplied by IClientFluidTypeExtensions;
        // core Create fluid rendering remains in the always-compiled renderers.
        // Keep Mods.java, AbstractComputerBehaviour and its event API because
        // core Create classes reference them even when ComputerCraft is absent.
        java.exclude('com/zurrtum/create/compat/CompatMod.java')
        java.exclude('com/zurrtum/create/compat/trinkets/**')
        java.exclude('com/zurrtum/create/compat/eiv/**')
        java.exclude('com/zurrtum/create/compat/rei/**')
        java.exclude('com/zurrtum/create/compat/computercraft/AllComputerDisplaySource.java')
        java.exclude('com/zurrtum/create/compat/computercraft/AllComputerPeripherals.java')
        java.exclude('com/zurrtum/create/compat/computercraft/ComputerDisplaySource.java')
        java.exclude('com/zurrtum/create/compat/computercraft/implementation/**')
        java.exclude('com/zurrtum/create/client/compat/**')
        java.exclude('com/zurrtum/create/foundation/recipe/ComponentsIngredient.java')
        java.exclude('com/zurrtum/create/mixin/IngredientMixin.java')

        // Fabric-specific resource/data-pack hooks. These need native
        // NeoForge replacements later.
        java.exclude('com/zurrtum/create/mixin/ReloadListenerMixin.java')
        java.exclude('com/zurrtum/create/mixin/BuiltInPackSourceMixin.java')
        java.exclude('com/zurrtum/create/mixin/CreateIntegrationMixin.java')
        java.exclude('com/zurrtum/create/mixin/ArchitecturyMixin.java')
        java.exclude('com/zurrtum/create/mixin/JustEnoughItemsMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/FabricModelAccessMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/IrisPipelinesMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/HoldMyItemsMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/AnimationResourceLoaderMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/WrapperBlockStateModelMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/FabricBlockStateModelMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/AbstractBlockRenderContextMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/AbstractTerrainRenderContextMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/BlockRenderInfoMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/CraftingViewRecipeAccessor.java')
        java.exclude('com/zurrtum/create/client/mixin/FabricEIVMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/FluidItemSpecialRendererMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/ItemSlotMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/RecipeViewMenuMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/RecipeViewScreenMixin.java')
        java.exclude('com/zurrtum/create/client/mixin/ViewTypeButtonMixin.java')
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': inputs.properties.version
    }

    exclude '_data'
    exclude 'fabric.mod.json'
    exclude 'create.accesswidener'
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(java_version)
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(java_version)
    targetCompatibility = JavaVersion.toVersion(java_version)
}

tasks.named('sourcesJar', Jar) {
    from('LICENSE')
    from('licenses') { into 'licenses' }
    exclude '_data'
    exclude 'assets'
    exclude 'data'
}

jar {
    inputs.property 'archivesName', project.base.archivesName

    from('LICENSE')
    from('licenses') { into 'licenses' }
}
